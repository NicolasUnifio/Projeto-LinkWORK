<div>
  <label>Produto: </label>
  <input type="text" [(ngModel)]="produto"><br><br>

  <label>Preço: </label>
  <input type="number" [(ngModel)]="preco"><br><br>

  <label>Quantidade: </label>
  <input type="number" [(ngModel)]="quantidade">
</div>

<hr>

<h3>Resumo</h3>
<p>Produto: {{ produto }}</p>
<p>Preço: R$ {{ preco | number:'1.2-2' }}</p>
<p>Quantidade: {{ quantidade }}</p>
<p>Total: R$ {{ (preco * quantidade) | number:'1.2-2' }}</p>
